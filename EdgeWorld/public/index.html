<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeWorld | Digital Theme Park</title>
    <meta
      name="description"
      content="サイバーパンクなデジタル遊園地 EdgeWorld。心理学エリアとステガノグラフィーエリアへ入場できます。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home-body">
    <div class="bg-grid" aria-hidden="true"></div>

    <main>
      <section
        class="scrub-scene home-portal"
        data-video-scrub
        data-scrub-seconds="10"
        data-scrub-ease="0.11"
        data-seek-threshold="0.06"
        aria-label="EdgeWorld入園ゲート"
      >
        <div class="scrub-sticky">
          <video
            class="scrub-video"
            muted
            playsinline
            preload="auto"
            aria-hidden="true"
          >
            <source src="assets/video/edgeworld-open-scrub.mp4" type="video/mp4" />
          </video>
          <div class="home-film" aria-hidden="true"></div>
          <div class="home-scanline" aria-hidden="true"></div>

          <nav class="home-nav" aria-label="メインナビゲーション">
            <a class="home-brand" href="index.html">EDGE<span>WORLD</span></a>
            <span class="home-status">SCROLL / ENTER</span>
          </nav>

          <div class="home-title">
            <p class="home-kicker">CYBERPUNK DIGITAL THEME PARK</p>
            <h1>ENTER<br />EDGEWORLD</h1>
            <p>
              スクロールでゲートを進み、表示される入口からアトラクションを選んでください。
            </p>
          </div>

          <div class="home-progress" aria-hidden="true">
            <span></span>
          </div>

          <div class="portal-card portal-card-tarot">
            <span class="portal-id">EXTERNAL AREA</span>
            <h2>NOCTURNE<br />FOREST</h2>
            <p>夜の森の中を探索して、タロットカードを見つけるエリア。</p>
            <a
              href="https://nocturne-d6e57.web.app/"
              target="_blank"
              rel="noopener noreferrer"
            >ENTER THE FOREST</a>
          </div>

          <div class="portal-card portal-card-stegano">
            <span class="portal-id">AREA 01</span>
            <h2>HIDDEN SIGNAL<br />GALLERY</h2>
            <p>画像に埋め込まれた文章を検出し、自分でもメッセージを隠せるエリア。</p>
            <a href="steganography.html">ENTER GALLERY</a>
          </div>

          <div class="home-final">
            <span>CHOOSE YOUR ATTRACTION</span>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
